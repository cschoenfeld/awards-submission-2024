<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=300,height=600">
    <title>Science Center Banner: 300x600</title>
    <link rel="stylesheet" href="css-js/style.css">
    
    <!-- clickTag url-->
    <script type="text/javascript">
      var clickTag = "https://ctsciencecenter.org/tickets";
    </script>
</head>
<body>
    <div id="ad">
        <div id="banner">

          <!-- ============== Frame One ============= -->
          <div id="frame_one">
						<div class="bgBox bg1Box">
							<img src="images/bg1.jpg" alt="" class="bg bg1">
						</div>
						<div class="bgBox bg2Box">
							<img src="images/bg2.jpg" alt="" class="bg bg2">
						</div>
						<div class="bgBox bg3Box">
							<img src="images/bg3.jpg" alt="" class="bg bg3">
						</div>
            <div class="explore">
              <img src="images/explore.png" alt="" class="txt">
            </div>
          </div>

          <!-- ============== Frame Two ============= -->
          <div id="frame_two">
            <div class="imagine">
              <img src="images/imagine.png" alt="" class="txt">
            </div>
          </div>

          <!-- ============== Frame Three ============= -->
          <div id="frame_three">
            <div class="overlay"></div>
            <div class="marvel">
              <img src="images/marvel.png" alt="" class="txt">
            </div>
            <img src="images/txt4.png" alt="" class="txt txt4">
            <img src="images/logo.png" alt="" class="logo">
						<div class="ctaBox">
							<div class="cta"></div>
							<img src="images/cta-txt.png" alt="" class="cta-txt">
						</div>
          </div>
          
          <div class="outerBorder"></div>   

        </div><!-- // End Banner Div -->

        <!-- Fallback & clickTag -->
        <a href="javascript:void(0);" onClick="window.open(window.clickTag)" class="clicktag" id="clicktag"></a>
        
    </div> <!-- // End Ad Div -->

    <script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.13_min.js"></script>
    <script src="css-js/custom.js" ></script>
</body>
</html>
